name: iOS CI Pull Request Checks

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_NAME: "MapViewer.xcodeproj"
  SCHEME_NAME: "MapViewer"
  DEVELOPER_DIR: "/Applications/Xcode_15.4.app/Contents/Developer"

jobs:
  pr-validation:
    name: Build & Test PR
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Resolve SPM Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "${{ env.PROJECT_NAME }}" \
            -scheme "${{ env.SCHEME_NAME }}"

      - name: Run Tests
        run: |
          SIM_LINE=$(xcrun simctl list devices available | grep -E "iPhone 15|iPhone 14|iPhone" | head -n 1)
          SIM_ID=$(echo "${SIM_LINE}" | grep -oE '[0-9A-Fa-f]{8}-([0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}' || true)
          
          if [[ -n "${SIM_ID}" ]]; then
            echo "Using Simulator ID: ${SIM_ID}"
            xcrun simctl boot "${SIM_ID}" 2>/dev/null || true
            DESTINATION="platform=iOS Simulator,id=${SIM_ID}"
          else
            DESTINATION="platform=iOS Simulator,name=iPhone 15"
          fi
          
          echo "Executing tests with destination: ${DESTINATION}"
          xcodebuild test \
            -project "${{ env.PROJECT_NAME }}" \
            -scheme "${{ env.SCHEME_NAME }}" \
            -destination "${DESTINATION}" \
            -only-testing:MapViewerTests \
            CODE_SIGNING_ALLOWED=NO
