name: iOS Build & Export IPA

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      export_method:
        description: "IPA Export Method"
        required: true
        default: "ad-hoc"
        type: choice
        options:
          - "ad-hoc"
          - "development"
          - "app-store"
      configuration:
        description: "Build Configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - "Release"
          - "Debug"
      run_tests:
        description: "Run automated tests before archiving"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_NAME: "MapViewer.xcodeproj"
  SCHEME_NAME: "MapViewer"
  BUNDLE_ID: "com.antigravity.mapviewer"
  DEVELOPER_DIR: "/Applications/Xcode_15.4.app/Contents/Developer"

jobs:
  # =========================================================================
  # 1. TEST & VALIDATION JOB
  # =========================================================================
  test:
    name: Test & Validate
    runs-on: macos-14
    if: github.event_name != 'workflow_dispatch' || inputs.run_tests == true
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select and Verify Xcode
        run: |
          echo "Selecting Xcode 15.4+..."
          if [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version
          swift --version

      - name: Verify Project and Shared Schemes
        run: |
          echo "Listing available schemes..."
          xcodebuild -list -project "${{ env.PROJECT_NAME }}"
          
          # Ensure scheme exists
          if ! xcodebuild -list -project "${{ env.PROJECT_NAME }}" | grep -q "${{ env.SCHEME_NAME }}"; then
            echo "❌ Error: Required shared scheme '${{ env.SCHEME_NAME }}' not found."
            exit 1
          fi

      - name: Cache SPM Dependencies
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved', 'Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "${{ env.PROJECT_NAME }}" \
            -scheme "${{ env.SCHEME_NAME }}"

      - name: Run Unit & Integration Tests
        run: |
          SIM_LINE=$(xcrun simctl list devices available | grep -E "iPhone 15|iPhone 14|iPhone" | head -n 1)
          SIM_ID=$(echo "${SIM_LINE}" | grep -oE '[0-9A-Fa-f]{8}-([0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}' || true)
          
          if [[ -n "${SIM_ID}" ]]; then
            echo "Using Simulator ID: ${SIM_ID}"
            xcrun simctl boot "${SIM_ID}" 2>/dev/null || true
            DESTINATION="platform=iOS Simulator,id=${SIM_ID}"
          else
            DESTINATION="platform=iOS Simulator,name=iPhone 15"
          fi
          
          echo "Executing tests with destination: ${DESTINATION}"
          xcodebuild test \
            -project "${{ env.PROJECT_NAME }}" \
            -scheme "${{ env.SCHEME_NAME }}" \
            -destination "${DESTINATION}" \
            -only-testing:MapViewerTests \
            -resultBundlePath "build/TestResults.xcresult" \
            CODE_SIGNING_ALLOWED=NO

  # =========================================================================
  # 2. ARCHIVE & EXPORT IPA JOB
  # =========================================================================
  build-ipa:
    name: Build & Export IPA
    runs-on: macos-14
    needs: [test]
    # Run if test succeeded, or if test was skipped on workflow_dispatch
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select and Verify Xcode
        run: |
          if [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Check Code Signing Secrets Availability
        id: check-secrets
        run: |
          if [[ -n "${{ secrets.BUILD_CERTIFICATE_BASE64 }}" ]] && [[ -n "${{ secrets.P12_PASSWORD }}" ]]; then
            echo "has_signing_secrets=true" >> "$GITHUB_OUTPUT"
            echo "✅ Code signing secrets detected."
          else
            echo "has_signing_secrets=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Notice: BUILD_CERTIFICATE_BASE64 and/or P12_PASSWORD are not configured."
            echo "The build will proceed with an ad-hoc/development device archive."
          fi

      - name: Setup Code Signing
        if: steps.check-secrets.outputs.has_signing_secrets == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          chmod +x scripts/setup-signing.sh
          ./scripts/setup-signing.sh

      - name: Build, Archive & Export IPA
        env:
          CONFIGURATION: ${{ inputs.configuration || 'Release' }}
          EXPORT_METHOD: ${{ inputs.export_method || 'ad-hoc' }}
          HAS_SIGNING: ${{ steps.check-secrets.outputs.has_signing_secrets }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '' }}
        run: |
          chmod +x scripts/build-ipa.sh
          ./scripts/build-ipa.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MapViewer-IPA
          path: build/export/MapViewer.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup Code Signing Credentials
        if: always() && steps.check-secrets.outputs.has_signing_secrets == 'true'
        run: |
          chmod +x scripts/cleanup-signing.sh
          ./scripts/cleanup-signing.sh
