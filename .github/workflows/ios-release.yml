name: iOS Production Tag Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PROJECT_NAME: "MapViewer.xcodeproj"
  SCHEME_NAME: "MapViewer"
  BUNDLE_ID: "com.antigravity.mapviewer"
  DEVELOPER_DIR: "/Applications/Xcode_15.4.app/Contents/Developer"

jobs:
  release:
    name: Build & Release IPA
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Resolve Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "${{ env.PROJECT_NAME }}" \
            -scheme "${{ env.SCHEME_NAME }}"

      - name: Check Code Signing Secrets Availability
        id: check-secrets
        run: |
          if [[ -n "${{ secrets.BUILD_CERTIFICATE_BASE64 }}" ]] && [[ -n "${{ secrets.P12_PASSWORD }}" ]]; then
            echo "has_signing_secrets=true" >> "$GITHUB_OUTPUT"
            echo "✅ Code signing secrets detected."
          else
            echo "has_signing_secrets=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Notice: BUILD_CERTIFICATE_BASE64 and/or P12_PASSWORD are not configured."
            echo "The build will proceed with an ad-hoc/development device archive."
          fi

      - name: Setup Code Signing
        if: steps.check-secrets.outputs.has_signing_secrets == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          chmod +x scripts/setup-signing.sh
          ./scripts/setup-signing.sh

      - name: Create Device Archive & Export
        env:
          EXPORT_METHOD: ${{ steps.check-secrets.outputs.has_signing_secrets == 'true' && 'app-store' || 'ad-hoc' }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '' }}
          HAS_SIGNING: ${{ steps.check-secrets.outputs.has_signing_secrets }}
        run: |
          chmod +x scripts/build-ipa.sh
          ./scripts/build-ipa.sh

      - name: Upload Release IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MapViewer-Release-IPA
          path: build/export/MapViewer.ipa
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/export/MapViewer.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Teardown Keychain
        if: always() && steps.check-secrets.outputs.has_signing_secrets == 'true'
        run: |
          chmod +x scripts/cleanup-signing.sh
          ./scripts/cleanup-signing.sh
